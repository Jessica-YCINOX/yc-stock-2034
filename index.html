<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2034 允強 每日籌碼表</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #faf9f6;
      color: #1f1f1f;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 16px 0;
    }
    /* 頂部控制列 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }
    .btn, .date-picker {
      background: #fff;
      border: 1px solid #dcdad5;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #f2f0ec; }
    .btn.active { background: #1f1f1f; color: #fff; border-color: #1f1f1f; }
    .btn.fetch-btn { border-color: #b8c4d4; color: #1a4b84; font-weight: 500; }
    .btn.fetch-btn:hover { background: #eef4fb; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 主卡片區 */
    .card {
      background: #ffffff;
      border: 1px solid #e6e4df;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .card-date {
      font-size: 16px;
      font-weight: 500;
    }
    .status-badge {
      font-size: 12px;
      color: #666;
      background: #f3f2ee;
      padding: 3px 8px;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }
    th {
      color: #666;
      font-weight: 400;
      text-align: right;
      padding-bottom: 12px;
      border-bottom: 1px solid #eceae4;
    }
    th:first-child { text-align: left; }
    td {
      padding: 12px 0;
      text-align: right;
      border-bottom: 1px solid #f0eee9;
      font-variant-numeric: tabular-nums;
    }
    td:first-child {
      text-align: left;
      color: #222;
    }
    /* 編輯模式輸入框 */
    td input {
      width: 66px;
      text-align: right;
      padding: 4px 6px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 14px;
    }
    /* 底部四格價位 */
    .ohlc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      margin-top: 20px;
      padding-top: 4px;
      gap: 8px;
    }
    .ohlc-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    .ohlc-val {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .ohlc-val input {
      width: 64px;
      text-align: center;
      padding: 4px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 700;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      background: #222;
      color: #fff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; }
    @media(max-width:600px){.container{padding:12px}.toolbar{flex-wrap:wrap;gap:8px}table{font-size:13px}th,td{padding:8px 5px}}
  </style>
</head>
<body>

<div class="container">
  <h1>2034 允強 每日籌碼表</h1>
  
  <div class="toolbar">
    <input type="date" id="dateInput" class="date-picker" />
    <button id="fetchBtn" class="btn fetch-btn">自動抓取當日</button>
    <button id="copyBtn" class="btn">複製文字</button>
  </div>

  <p style="font-size:13px;color:#64748b">唯讀查詢｜資料來源：FinMind。若抓取失敗或資料未更新，請勿將 0 視為實際數值。</p>
  <div class="card">
    <div class="card-header">
      <div class="card-date" id="displayDate">日期 ----/--/--</div>
      <div class="status-badge" id="statusBadge">準備就緒</div>
    </div>
    <table>
      <thead>
        <tr>
          <th></th>
          <th>買進</th>
          <th>賣出</th>
          <th>餘額</th>
        </tr>
      </thead>
      <tbody id="chipBody"></tbody>
    </table>

    <div class="ohlc-grid" id="ohlcGrid"></div>
  </div>
</div>

<div id="toast" class="toast">提示訊息</div>

<script>
  const STOCK_ID = "2034";
  const STORAGE_KEY = "stock_chips_2034_v1";
  const isEditing = false;

  // 取得預設空白資料結構
  function createEmptyData(dateStr) {
    return {
      date: dateStr.replace(/-/g, "/"),
      rows: [
        { name: "融資", buy: 0, sell: 0, balance: 0 },
        { name: "融券", buy: 0, sell: 0, balance: 0 },
        { name: "自營商", buy: 0, sell: 0, balance: 0 },
        { name: "外資", buy: 0, sell: 0, balance: 0 },
        { name: "投信", buy: 0, sell: 0, balance: 0 },
        { name: "現股當沖", buy: 0, sell: 0, balance: 0 },
        { name: "資券相抵", buy: 0, sell: 0, balance: 0 },
        { name: "成交張數", buy: 0, sell: 0, balance: 0 }
      ],
      ohlc: { open: "0.00", high: "0.00", low: "0.00", close: "0.00" }
    };
  }

  // 所有日期皆使用相同的 FinMind 抓取流程，不內建 11/11 範例數據。
  let currentData = createEmptyData("2026-11-11");

  function loadFromStorage(isoDate) {
    try {
      const db = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      // 清除舊版本自動植入的 11/11 範例，僅執行一次；其他日期保留。
      const migrationKey = "stock_chips_2034_1111_sample_removed_v2";
      if (!localStorage.getItem(migrationKey)) {
        delete db["2026-11-11"];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        localStorage.setItem(migrationKey, "1");
      }
      return db[isoDate] || null;
    } catch (err) {
      console.warn("讀取本機資料失敗", err);
      return null;
    }
  }

  function saveToStorage(isoDate, dataObj) {
    const db = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    db[isoDate] = dataObj;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  // 格式化數字（大於0加 + 號，小於0加 - 號）
  function formatVal(num, showSign = false) {
    if (num === 0 || isNaN(num)) return "0";
    const absStr = Math.abs(Math.round(num)).toLocaleString();
    if (!showSign) return Math.round(num).toLocaleString();
    return num > 0 ? `+ ${absStr}` : `- ${absStr}`;
  }

  // 渲染畫面
  function render() {
    document.getElementById("displayDate").textContent = `日期 ${currentData.date}`;
    const tbody = document.getElementById("chipBody");
    tbody.innerHTML = "";

    currentData.rows[6] = { name: "資券相抵", buy: 0, sell: 0, balance: 0 };
    currentData.rows.forEach((row, idx) => {
      const tr = document.createElement("tr");
      if (isEditing) {
        tr.innerHTML = `
          <td>${row.name}</td>
          <td><input type="number" data-idx="${idx}" data-field="buy" value="${row.buy}" ${idx === 6 ? "disabled" : ""}></td>
          <td><input type="number" data-idx="${idx}" data-field="sell" value="${row.sell}" ${idx === 6 ? "disabled" : ""}></td>
          <td><input type="number" data-idx="${idx}" data-field="balance" value="${row.balance}" ${idx === 6 ? "disabled" : ""}></td>
        `;
      } else {
        tr.innerHTML = `
          <td>${row.name}</td>
          <td>${formatVal(row.buy, true)}</td>
          <td>${formatVal(row.sell, true)}</td>
          <td>${formatVal(row.balance, false)}</td>
        `;
      }
      tbody.appendChild(tr);
    });

    const ohlcGrid = document.getElementById("ohlcGrid");
    const labels = [
      { label: "開盤", key: "open" },
      { label: "最高", key: "high" },
      { label: "最低", key: "low" },
      { label: "收盤", key: "close" }
    ];
    ohlcGrid.innerHTML = labels.map(item => `
      <div>
        <div class="ohlc-label">${item.label}</div>
        <div class="ohlc-val">
          ${isEditing 
            ? `<input type="text" data-ohlc="${item.key}" value="${currentData.ohlc[item.key]}">` 
            : currentData.ohlc[item.key]}
        </div>
      </div>
    `).join("");
  }

  // 從 FinMind 公開 API 自動抓取當日 2034 籌碼與價量
  async function fetchFinMindData(isoDate) {
    const fetchBtn = document.getElementById("fetchBtn");
    const badge = document.getElementById("statusBadge");
    fetchBtn.disabled = true;
    fetchBtn.textContent = "抓取中...";
    badge.textContent = "連線查詢中...";

    const baseUrl = "https://api.finmindtrade.com/api/v4/data";
    const query = `data_id=${STOCK_ID}&start_date=${isoDate}&end_date=${isoDate}`;

    try {
      // 平行發送 4 個請求：日成交價、三大法人、融資融券、外資持股
      const [priceRes, instRes, marginRes, qfiisRes, dayTradeRes] = await Promise.all([
        fetch(`${baseUrl}?dataset=TaiwanStockPrice&${query}`).then(r => r.json()),
        fetch(`${baseUrl}?dataset=TaiwanStockInstitutionalInvestorsBuySell&${query}`).then(r => r.json()),
        fetch(`${baseUrl}?dataset=TaiwanStockMarginPurchaseShortSale&${query}`).then(r => r.json()),
        fetch(`${baseUrl}?dataset=TaiwanStockShareholding&${query}`).then(r => r.json()),
        fetch(`${baseUrl}?dataset=TaiwanStockDayTrading&${query}`).then(r => r.json()).catch(err => ({ data: [], error: String(err) }))
      ]);

      if (!priceRes.data || priceRes.data.length === 0) {
        badge.textContent = "無交易資料 (休市或未更新)";
        showToast("該日期查無開盤交易資料");
        return;
      }

      const newData = createEmptyData(isoDate);

      // 1. 解析開高低收與成交張數
      const p = priceRes.data[0];
      newData.ohlc = {
        open: Number(p.open).toFixed(2),
        high: Number(p.max).toFixed(2),
        low: Number(p.min).toFixed(2),
        close: Number(p.close).toFixed(2)
      };
      newData.rows[7].balance = Math.round(p.Trading_Volume / 1000); // 股轉張

      // 2. 解析融資融券與資券相抵
      if (marginRes.data && marginRes.data.length > 0) {
        const m = marginRes.data[0];
        const marginDiff = m.MarginPurchaseTodayBalance - m.MarginPurchaseYesterdayBalance;
        const shortDiff = m.ShortSaleTodayBalance - m.ShortSaleYesterdayBalance;
        
        newData.rows[0].buy = marginDiff > 0 ? marginDiff : 0;
        newData.rows[0].sell = marginDiff < 0 ? marginDiff : 0;
        newData.rows[0].balance = m.MarginPurchaseTodayBalance;

        newData.rows[1].buy = shortDiff > 0 ? shortDiff : 0;
        newData.rows[1].sell = shortDiff < 0 ? shortDiff : 0;
        newData.rows[1].balance = m.ShortSaleTodayBalance;

      }

      // 3. 解析三大法人買賣超 (股轉張)
      if (instRes.data && instRes.data.length > 0) {
        let foreignNet = 0, trustNet = 0, dealerNet = 0;
        instRes.data.forEach(item => {
          const netLots = Math.round((item.buy - item.sell) / 1000);
          if (item.name.includes("Foreign_Investor")) foreignNet += netLots;
          else if (item.name.includes("Investment_Trust")) trustNet += netLots;
          else if (item.name.includes("Dealer")) dealerNet += netLots;
        });

        // 自營商
        newData.rows[2].buy = dealerNet > 0 ? dealerNet : 0;
        newData.rows[2].sell = dealerNet < 0 ? dealerNet : 0;
        // 外資
        newData.rows[3].buy = foreignNet > 0 ? foreignNet : 0;
        newData.rows[3].sell = foreignNet < 0 ? foreignNet : 0;
        // 投信
        newData.rows[4].buy = trustNet > 0 ? trustNet : 0;
        newData.rows[4].sell = trustNet < 0 ? trustNet : 0;
      }

      // 4. 外資總持股張數餘額
      if (qfiisRes.data && qfiisRes.data.length > 0) {
        const q = qfiisRes.data[0];
        newData.rows[3].balance = Math.round(q.ForeignInvestmentShares / 1000);
      }

      // FinMind 現股當沖成交量（股）換算張；若資料尚未發布則保留原值並提示。
      const dayTrade = Array.isArray(dayTradeRes.data)
        ? dayTradeRes.data.find(x => String(x.stock_id) === STOCK_ID && x.date === isoDate)
        : null;
      const hasDayTrade = !!dayTrade && dayTrade.Volume !== null && dayTrade.Volume !== undefined
        && Number.isFinite(Number(dayTrade.Volume)) && Number(dayTrade.Volume) >= 0;
      if (hasDayTrade) {
        newData.rows[5].buy = Math.round(Number(dayTrade.Volume) / 1000);
        newData.rows[5].sell = 0;
        newData.rows[5].balance = 0;
      }
      // 資券相抵不抓來源，永遠固定 0。
      newData.rows[6] = { name: "資券相抵", buy: 0, sell: 0, balance: 0 };
      // 保留既有的投信/自營商自建餘額
      const oldSaved = null;
      if (oldSaved) {
        newData.rows[2].balance = oldSaved.rows[2].balance || newData.rows[2].balance;
        newData.rows[4].balance = oldSaved.rows[4].balance || newData.rows[4].balance;
        if (!hasDayTrade && oldSaved.rows[5]) newData.rows[5] = oldSaved.rows[5];
      }

      currentData = newData;
      
      badge.textContent = hasDayTrade ? "已更新（含現股當沖）" : "其他資料已更新，當沖資料尚未取得";
      showToast(hasDayTrade ? "已成功抓取 2034 籌碼及當沖資料！" : "當沖資料尚未取得，請稍後重新抓取");
      render();
    } catch (err) {
      console.error(err);
      currentData = createEmptyData(isoDate); render();
      badge.textContent = "抓取失敗，資料不可用";
      showToast("網路連線異常或 API 達每小時上限");
    } finally {
      fetchBtn.disabled = false;
      fetchBtn.textContent = "自動抓取當日";
    }
  }

  // 事件綁定：切換日期
  const dateInput = document.getElementById("dateInput");
  dateInput.addEventListener("change", (e) => {
    const isoDate = e.target.value;
    if (!isoDate) return;
    currentData = createEmptyData(isoDate);
    render();
    fetchFinMindData(isoDate);
  });

  // 事件綁定：手動點擊自動抓取
  document.getElementById("fetchBtn").addEventListener("click", () => {
    if (dateInput.value) fetchFinMindData(dateInput.value);
  });

  // 事件綁定：複製文字
  document.getElementById("copyBtn").addEventListener("click", () => {
    let text = `2034 允強 每日籌碼表 (${currentData.date})\n`;
    currentData.rows.forEach(r => {
      text += `${r.name}：買進 ${formatVal(r.buy, true)} / 賣出 ${formatVal(r.sell, true)} / 餘額 ${formatVal(r.balance)}\n`;
    });
    text += `開盤 ${currentData.ohlc.open} | 最高 ${currentData.ohlc.high} | 最低 ${currentData.ohlc.low} | 收盤 ${currentData.ohlc.close}`;
    
    navigator.clipboard.writeText(text).then(() => {
      showToast("已複製籌碼文字！");
    });
  });

  // 使用台灣時間，避免電腦在其他時區時日期偏移。
  function taiwanToday() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date());
  }

  function previousWeekday(isoToday) {
    const d = new Date(`${isoToday}T12:00:00Z`);
    do { d.setUTCDate(d.getUTCDate() - 1); }
    while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
    return d.toISOString().slice(0, 10);
  }

  async function initializePreviousTradingDay() {
    const today = taiwanToday();
    let selectedDate = previousWeekday(today);
    const badge = document.getElementById("statusBadge");
    badge.textContent = "查詢前一交易日中...";
    try {
      // 用 2034 實際成交紀錄判斷休市日，而非僅排除週末。
      const from = new Date(`${today}T12:00:00Z`);
      from.setUTCDate(from.getUTCDate() - 35);
      const startDate = from.toISOString().slice(0, 10);
      const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${STOCK_ID}&start_date=${startDate}&end_date=${selectedDate}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      const dates = Array.isArray(payload.data)
        ? payload.data.map(r => r.date).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d) && d < today).sort()
        : [];
      if (dates.length) selectedDate = dates[dates.length - 1];
      else badge.textContent = "無法確認休市日，暫以最近平日顯示";
    } catch (err) {
      console.warn("交易日查詢失敗，改用最近平日", err);
      badge.textContent = "交易日查詢失敗，暫以最近平日顯示";
    }
    dateInput.value = selectedDate;
    currentData = createEmptyData(selectedDate);
    render();
    await fetchFinMindData(selectedDate);
  }

  initializePreviousTradingDay();
</script>
</body>
</html>
